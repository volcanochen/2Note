<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 962" width="680" role="img">
<title>2Note 数据流与线程交互图</title>
<style>
.ti{font:500 15px 'Segoe UI',sans-serif;fill:#2C2C2A}
.ct{font:500 13px 'Segoe UI',sans-serif;fill:#042C53}
.ct2{font:500 13px 'Segoe UI',sans-serif;fill:#085041}
.ct3{font:500 13px 'Segoe UI',sans-serif;fill:#633806}
.th{font:500 13px 'Segoe UI',sans-serif;fill:#2C2C2A}
.ts{font:400 12px 'Segoe UI',sans-serif;fill:#444441}
.lb{font:500 14px 'Segoe UI',sans-serif;fill:#A32D2D}
.lg{font:400 12.5px 'Segoe UI',sans-serif;fill:#444441}
.lg b{font-weight:500;fill:#2C2C2A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text class="ti" x="40" y="42">2Note：数据流与线程交互</text>
<rect x="40" y="70" width="270" height="500" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ct" x="55" y="95">OneNote.exe 进程</text>
<rect x="60" y="120" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="175" y="142" text-anchor="middle" dominant-baseline="central">UI 线程 (STA)</text>
<text class="ts" x="175" y="165" text-anchor="middle" dominant-baseline="central">功能区 · 右键菜单 · 页面</text>
<rect x="50" y="420" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="160" y="440" text-anchor="middle" dominant-baseline="central">OneNote.Application</text>
<text class="ts" x="160" y="461" text-anchor="middle" dominant-baseline="central">GetPageContent · UpdatePageContent</text>
<text class="ts" x="160" y="481" text-anchor="middle" dominant-baseline="central">IDispatch::Invoke 跨进程调用</text>
<rect x="370" y="70" width="270" height="500" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ct2" x="385" y="95">DllHost.exe · COM 代理进程</text>
<rect x="390" y="120" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="505" y="141" text-anchor="middle" dominant-baseline="central">主 STA 线程</text>
<text class="ts" x="505" y="162" text-anchor="middle" dominant-baseline="central">OnConnection · GetCustomUI</text>
<text class="ts" x="505" y="180" text-anchor="middle" dominant-baseline="central">OnPaste → Run(_appObj)</text>
<text class="ts" x="505" y="198" text-anchor="middle" dominant-baseline="central">宿主消息泵分发 COM 回调</text>
<rect x="390" y="420" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="505" y="441" text-anchor="middle" dominant-baseline="central">热键泵线程 (STA 专用)</text>
<text class="ts" x="505" y="462" text-anchor="middle" dominant-baseline="central">消息窗口 + GetMessage 循环</text>
<text class="ts" x="505" y="480" text-anchor="middle" dominant-baseline="central">WM_HOTKEY → Run(null)</text>
<rect x="170" y="620" width="340" height="110" rx="16" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ct3" x="185" y="644">Windows 系统层</text>
<rect x="190" y="660" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="260" y="678" text-anchor="middle" dominant-baseline="central">全局热键表</text>
<text class="ts" x="260" y="697" text-anchor="middle" dominant-baseline="central">RegisterHotKey</text>
<rect x="350" y="660" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="420" y="678" text-anchor="middle" dominant-baseline="central">键盘分发</text>
<text class="ts" x="420" y="697" text-anchor="middle" dominant-baseline="central">命中 → WM_HOTKEY</text>
<path d="M290,130 L390,130" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="340" y="112" text-anchor="middle">①</text>
<path d="M290,175 L390,175" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="340" y="194" text-anchor="middle">⑥</text>
<path d="M505,210 L505,420" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="519" y="320">②</text>
<path d="M460,500 L460,690 L330,690" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="474" y="588">③</text>
<path d="M280,190 L280,685 L350,685" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="292" y="410">④</text>
<path d="M420,660 L420,500" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="404" y="588">⑤</text>
<path d="M390,195 L345,195 L345,455 L270,455" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="333" y="215">⑦</text>
<path d="M390,460 L270,460" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="330" y="448">⑧</text>
<path d="M170,420 L170,190" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lb" x="182" y="310">⑨</text>
<text class="th" x="40" y="768">步骤说明</text>
<text class="lg" x="40" y="794">① OneNote 启动：COM 激活 mscoree，插件 DLL 装入 DllHost 代理进程</text>
<text class="lg" x="40" y="813">② 主 STA 创建热键泵线程（专用 STA），AutoResetEvent 同步注册结果</text>
<text class="lg" x="40" y="832">③ 热键泵线程 RegisterHotKey(Alt+Shift+V) 写入系统全局热键表</text>
<text class="lg" x="40" y="851">④ 用户按键：系统命中热键表，WM_HOTKEY 投递到热键泵线程队列</text>
<text class="lg" x="40" y="870">⑤ 热键泵 GetMessage 分发 → Run(null)：GetActiveObject 取本线程公寓代理</text>
<text class="lg" x="40" y="889">⑥ 用户点击 2note 按钮 / 右键：跨进程 COM 回调主 STA → OnPaste → Run(_appObj)</text>
<text class="lg" x="40" y="908">⑦ GetPageContent / UpdatePageContent：IDispatch 跨进程调用，out BSTR 写回 XML</text>
<text class="lg" x="40" y="927">⑧ 热键线程的粘贴走 ⑧ 路径，与 ⑦（按钮路径）殊途同归</text>
<text class="lg" x="40" y="946">⑨ UpdatePageContent 成功 → OneNote UI 线程重新渲染页面</text>
</svg>
